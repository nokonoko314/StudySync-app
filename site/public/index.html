  <p class="brand">StudySync</p>
  <h1>忘れる前に、自動で復習。</h1>
  <p class="lead">StudySync は、勉強した内容を忘却曲線にあわせて自動で復習の予定に入れる、学習スケジュールのアプリです。</p>
  <ul>
    <li>やることを時間軸に置いて、その日の勉強を計画</li>
    <li>完了すると、1日後・3日後・1週間後…と復習を自動で追加</li>
    <li>教科ごとの勉強時間を統計で確認</li>
    <li>Googleカレンダーの予定を表示して、空き時間に勉強を入れられる</li>
    <li>ホーム画面のウィジェットで、今日の予定をすぐ確認</li>
  </ul>
  <p>Android 向けに提供しています。</p>
